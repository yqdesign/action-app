<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Action Tracker</title>
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --text: #2b2a28;
    --muted: #7a766f;
    --border: #e4e0d8;
    --soft: #efece6;
    --accent: #e8761e;
    --accent-ink: #ffffff;
    --red: #c0392b;
    --red-bg: #fbeceb;
    --green: #2e7d4f;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b19;
      --card: #262522;
      --text: #efece6;
      --muted: #a29d94;
      --border: #38362f;
      --soft: #2f2d29;
      --accent: #f08a3a;
      --accent-ink: #1c1b19;
      --red: #ef7a6c;
      --red-bg: #3a2522;
      --green: #6fcf97;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b19;
    --card: #262522;
    --text: #efece6;
    --muted: #a29d94;
    --border: #38362f;
    --soft: #2f2d29;
    --accent: #f08a3a;
    --accent-ink: #1c1b19;
    --red: #ef7a6c;
    --red-bg: #3a2522;
    --green: #6fcf97;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.45;
  }
  .hidden { display: none !important; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 1.05rem; }

  .userbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; font-size: 0.95rem; color: var(--muted); }
  .userbar strong { color: var(--text); }
  .pill { display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 1px 8px; margin-left: 6px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
  .stat .n { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
  .stat .l { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  .stat.open .n { color: var(--accent); }
  .stat.overdue .n { color: var(--red); }
  .stat.overdue.zero .n { color: var(--muted); }

  form { display: grid; gap: 12px; }
  form h2 { margin: 0 0 2px; font-size: 1.2rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: grid; gap: 6px; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
  input[type="text"], input[type="password"], input[type="date"] {
    font: inherit;
    font-size: 1.05rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    width: 100%;
    min-width: 0;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn {
    font: inherit;
    font-weight: 700;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 10px;
    padding: 13px 20px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 7px 14px; font-weight: 600; font-size: 0.95rem; }
  .btn.ghost:hover { background: var(--soft); filter: none; }
  .btn[disabled] { opacity: 0.6; cursor: wait; }
  .msg { color: var(--red); font-size: 0.95rem; min-height: 1.2em; margin: 0; }
  .msg.ok { color: var(--green); }

  .owner-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .owner-head h3 { margin: 0; font-size: 1.25rem; }
  .owner-head .sub { color: var(--muted); font-size: 0.95rem; white-space: nowrap; }
  .chip { display: inline-block; font-size: 0.8rem; font-weight: 700; color: var(--red); background: var(--red-bg); border-radius: 99px; padding: 2px 10px; margin-left: 8px; vertical-align: middle; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 12px;
    border-top: 1px solid var(--border);
    border-left: 4px solid transparent;
    margin-left: -12px; margin-right: -12px;
  }
  li.item:first-child { border-top: 0; }
  li.item.overdue { background: var(--red-bg); border-left-color: var(--red); border-radius: 8px; }
  li.item input[type="checkbox"] {
    width: 26px; height: 26px; flex: none; margin: 2px 0 0;
    accent-color: var(--accent); cursor: pointer;
  }
  .body { flex: 1; min-width: 0; }
  .task { overflow-wrap: anywhere; }
  .due { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  li.item.overdue .due { color: var(--red); font-weight: 700; }
  li.item.done .task { text-decoration: line-through; color: var(--muted); }
  .del {
    flex: none; background: none; border: 0; color: var(--muted);
    font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 2px 8px; border-radius: 8px;
  }
  .del:hover { color: var(--red); background: var(--soft); }

  .empty { text-align: center; color: var(--muted); padding: 36px 20px; }
  .foot { display: flex; justify-content: flex-end; margin-top: 20px; }
  .link { background: none; border: 0; font: inherit; font-size: 0.95rem; color: var(--muted); cursor: pointer; text-decoration: underline; }
  .link:hover { color: var(--text); }

  .status { margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); min-height: 1.3em; }
  .status.err { color: var(--red); font-weight: 600; }

  .login { max-width: 420px; margin: 24px auto 0; }
  .team-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .team-list li:first-child { border-top: 0; }
  .team-list .u { font-weight: 600; }
  .team-list .r { color: var(--muted); font-size: 0.9rem; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 0; }

  @media (max-width: 560px) {
    body { font-size: 17px; }
    .row { grid-template-columns: 1fr; }
    .stat .n { font-size: 1.8rem; }
    .stat { padding: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Action <span>Tracker</span></h1>
    <p>Capture every agreed action while it’s fresh. Nothing slips.</p>
    <div class="userbar hidden" id="userBar">
      <span>Signed in as <strong id="whoName"></strong><span class="pill hidden" id="whoRole">Admin</span></span>
      <button class="btn ghost" id="btnPw" type="button">Change password</button>
      <button class="btn ghost" id="btnSignOut" type="button">Sign out</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </header>

  <!-- Sign in -->
  <section class="card login" id="loginView">
    <form id="loginForm" autocomplete="on">
      <h2>Sign in</h2>
      <label>Username
        <input type="text" id="loginUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. priya">
      </label>
      <label>Password
        <input type="password" id="loginPass" name="password" autocomplete="current-password">
      </label>
      <p class="msg" id="loginMsg" role="alert"></p>
      <button class="btn" type="submit" id="loginBtn">Sign in</button>
    </form>
  </section>

  <!-- App -->
  <div id="appView" class="hidden">
    <section class="card hidden" id="pwCard">
      <form id="pwForm" autocomplete="off">
        <h2>Change your password</h2>
        <label>New password
          <input type="password" id="newPass" autocomplete="new-password" placeholder="At least 6 characters">
        </label>
        <p class="msg" id="pwMsg" role="alert"></p>
        <button class="btn" type="submit">Save new password</button>
      </form>
    </section>

    <section class="stats" aria-label="Summary">
      <div class="stat open"><div class="n" id="nOpen">0</div><div class="l">Open</div></div>
      <div class="stat done"><div class="n" id="nDone">0</div><div class="l">Done</div></div>
      <div class="stat overdue zero" id="statOverdue"><div class="n" id="nOverdue">0</div><div class="l">Overdue</div></div>
    </section>

    <section class="card">
      <form id="form" autocomplete="off">
        <h2>Add an action</h2>
        <label>Action
          <input type="text" id="task" placeholder="e.g. Send revised quote to client" maxlength="200">
        </label>
        <div class="row">
          <label>Owner
            <input type="text" id="owner" list="owners" placeholder="Who’s doing it?" maxlength="60">
            <datalist id="owners"></datalist>
          </label>
          <label>Due date
            <input type="date" id="due">
          </label>
        </div>
        <p class="msg" id="msg" role="alert"></p>
        <button class="btn" type="submit">Add action</button>
      </form>
    </section>

    <div id="groups"></div>

    <div class="foot"><button class="link" id="clearDone" type="button">Clear completed actions</button></div>

    <!-- Admin only -->
    <section class="card hidden" id="teamCard">
      <h2 style="margin:0 0 8px;font-size:1.2rem">Team members</h2>
      <ul class="team-list" id="teamList"></ul>
      <form id="teamForm" autocomplete="off" style="margin-top:16px">
        <div class="row">
          <label>New username
            <input type="text" id="newUser" autocapitalize="none" spellcheck="false" placeholder="e.g. sam" maxlength="30">
          </label>
          <label>Initial password
            <input type="text" id="newUserPass" autocomplete="off" placeholder="At least 6 characters">
          </label>
        </div>
        <p class="hint">Share the initial password with them directly and ask them to change it after signing in.</p>
        <p class="msg" id="teamMsg" role="alert"></p>
        <button class="btn" type="submit">Add user</button>
      </form>
    </section>
  </div>
</div>

<script>
(function () {
  var SUPABASE_URL = 'https://cibihrmjgnbhvstfxkiy.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_UKPi5TBU9nAZIvJ3sVjmyA_f1NJMJ5X';
  var EMAIL_DOMAIN = '@actiontracker.example';
  var SESSION_KEY = 'action-tracker-session-v1';
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var session = loadSession();
  var profile = null;
  var actions = [];
  var loaded = false;
  var pollTimer = null;
  var refreshing = null;

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  function setMsg(id, text, ok) { var m = $(id); m.textContent = text || ''; m.className = 'msg' + (ok ? ' ok' : ''); }

  /* ---------- session storage ---------- */
  function loadSession() {
    try { var r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  }
  function storeSession(s) {
    session = s;
    try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  /* ---------- auth (Supabase Auth REST) ---------- */
  function authReq(path, method, body, token) {
    var h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return fetch(SUPABASE_URL + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined })
      .then(function (res) {
        return res.text().then(function (t) {
          var j = null;
          try { j = t ? JSON.parse(t) : null; } catch (e) {}
          if (!res.ok) {
            var err = new Error((j && (j.msg || j.message || j.error_description || j.error)) || ('Request failed (' + res.status + ')'));
            err.status = res.status;
            throw err;
          }
          return j;
        });
      });
  }
  function toSession(j, fallbackUserId) {
    return {
      access_token: j.access_token,
      refresh_token: j.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600),
      user_id: (j.user && j.user.id) || fallbackUserId
    };
  }
  function signIn(username, password) {
    return authReq('/auth/v1/token?grant_type=password', 'POST',
      { email: username.toLowerCase() + EMAIL_DOMAIN, password: password })
      .then(function (j) { storeSession(toSession(j)); });
  }
  function refreshSession() {
    if (!session) return Promise.reject(new Error('Signed out'));
    if (refreshing) return refreshing;
    refreshing = authReq('/auth/v1/token?grant_type=refresh_token', 'POST', { refresh_token: session.refresh_token })
      .then(function (j) { storeSession(toSession(j, session.user_id)); refreshing = null; })
      .catch(function (e) { refreshing = null; throw e; });
    return refreshing;
  }
  function validToken() {
    if (!session) return Promise.reject(new Error('Signed out'));
    if (session.expires_at - 60 < Date.now() / 1000) {
      return refreshSession().then(function () { return session.access_token; });
    }
    return Promise.resolve(session.access_token);
  }
  function forceSignOut(message) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    storeSession(null);
    profile = null; actions = []; loaded = false;
    setStatus('');
    show('appView', false); show('userBar', false); show('loginView', true);
    $('loginPass').value = '';
    setMsg('loginMsg', message || '');
  }

  /* ---------- data API ---------- */
  function rest(path, opts, retried) {
    opts = opts || {};
    return validToken().then(function (tok) {
      var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' };
      if (opts.prefer) h['Prefer'] = opts.prefer;
      return fetch(SUPABASE_URL + '/rest/v1' + path, {
        method: opts.method || 'GET', headers: h,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
    }).then(function (res) {
      if (res.status === 401 && !retried) {
        return refreshSession().then(function () { return rest(path, opts, true); });
      }
      if (res.status === 401) {
        forceSignOut('Your session has expired. Please sign in again.');
        throw new Error('Session expired');
      }
      if (!res.ok) {
        return res.text().then(function (t) {
          var m = t;
          try { m = JSON.parse(t).message || t; } catch (e) {}
          throw new Error(String(m).slice(0, 160));
        });
      }
      return res.status === 204 ? null : res.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  /* ---------- dates ---------- */
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function fmt(s) {
    var p = s.split('-');
    return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function defaultDue() {
    var d = new Date(); d.setDate(d.getDate() + 7);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function isOverdue(a) { return !a.done && a.due < todayStr(); }
  function fromRow(r) { return { id: r.id, task: r.task, owner: r.owner, due: r.due_date, done: !!r.done }; }

  /* ---------- status ---------- */
  function setStatus(msg, isErr) {
    var s = $('status');
    s.textContent = msg;
    s.className = 'status' + (isErr ? ' err' : '');
  }
  function okStatus() {
    var d = new Date();
    setStatus('Shared team list · updated ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
  }
  function fail(e) { setStatus('Something went wrong. ' + (e && e.message ? e.message : ''), true); }

  /* ---------- actions ---------- */
  function refresh() {
    if (!session) return Promise.resolve();
    return rest('/actions?select=id,task,owner,due_date,done&order=created_at.asc')
      .then(function (rows) { actions = rows.map(fromRow); loaded = true; render(); okStatus(); })
      .catch(function (e) { if (session) fail(e); });
  }

  function render() {
    var open = actions.filter(function (a) { return !a.done; }).length;
    var done = actions.length - open;
    var overdue = actions.filter(isOverdue).length;
    $('nOpen').textContent = open;
    $('nDone').textContent = done;
    $('nOverdue').textContent = overdue;
    $('statOverdue').classList.toggle('zero', overdue === 0);
    $('clearDone').style.display = done ? '' : 'none';

    var owners = [];
    actions.forEach(function (a) { if (owners.indexOf(a.owner) === -1) owners.push(a.owner); });
    owners.sort(function (x, y) { return x.toLowerCase() < y.toLowerCase() ? -1 : 1; });

    var dl = $('owners');
    dl.textContent = '';
    owners.forEach(function (o) { var op = document.createElement('option'); op.value = o; dl.appendChild(op); });

    var box = $('groups');
    box.textContent = '';

    if (!actions.length) {
      box.appendChild(el('section', 'card empty', loaded ? 'No actions yet. Add the first one above.' : 'Loading…'));
      return;
    }

    owners.forEach(function (o) {
      var mine = actions.filter(function (a) { return a.owner === o; });
      mine.sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
      });
      var mOpen = mine.filter(function (a) { return !a.done; }).length;
      var mOver = mine.filter(isOverdue).length;

      var card = el('section', 'card');
      var head = el('div', 'owner-head');
      var h = el('h3', null, o);
      if (mOver) h.appendChild(el('span', 'chip', mOver + ' overdue'));
      head.appendChild(h);
      head.appendChild(el('span', 'sub', mOpen + ' open · ' + (mine.length - mOpen) + ' done'));
      card.appendChild(head);

      var ul = el('ul');
      mine.forEach(function (a) {
        var li = el('li', 'item' + (a.done ? ' done' : '') + (isOverdue(a) ? ' overdue' : ''));
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!a.done;
        cb.setAttribute('aria-label', 'Mark done: ' + a.task);
        cb.addEventListener('change', function () {
          var prev = a.done;
          a.done = cb.checked;
          render();
          rest('/actions?id=eq.' + encodeURIComponent(a.id), { method: 'PATCH', body: { done: a.done } })
            .then(okStatus)
            .catch(function (e) { a.done = prev; render(); fail(e); });
        });

        var body = el('div', 'body');
        body.appendChild(el('div', 'task', a.task));
        body.appendChild(el('div', 'due', 'Due ' + fmt(a.due) + (isOverdue(a) ? ' · Overdue' : '')));

        var del = el('button', 'del', '×');
        del.type = 'button';
        del.setAttribute('aria-label', 'Delete action');
        del.addEventListener('click', function () {
          var snapshot = actions.slice();
          actions = actions.filter(function (x) { return x.id !== a.id; });
          render();
          rest('/actions?id=eq.' + encodeURIComponent(a.id), { method: 'DELETE' })
            .then(okStatus)
            .catch(function (e) { actions = snapshot; render(); fail(e); });
        });

        li.appendChild(cb); li.appendChild(body); li.appendChild(del);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      box.appendChild(card);
    });
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var task = $('task').value.trim();
    var owner = $('owner').value.trim();
    var due = $('due').value;
    var missing = [];
    if (!task) missing.push('action');
    if (!owner) missing.push('owner');
    if (!due) missing.push('due date');
    if (missing.length) { setMsg('msg', 'Please add: ' + missing.join(', ') + '.'); return; }
    setMsg('msg', '');

    var match = actions.filter(function (a) { return a.owner.toLowerCase() === owner.toLowerCase(); })[0];
    if (match) owner = match.owner;

    var btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    rest('/actions', { method: 'POST', prefer: 'return=representation', body: { task: task, owner: owner, due_date: due } })
      .then(function (rows) {
        actions.push(fromRow(rows[0]));
        $('task').value = '';
        $('due').value = defaultDue();
        $('task').focus();
        render();
        okStatus();
      })
      .catch(function (err) { setMsg('msg', 'Couldn’t save that action. Please try again.'); fail(err); })
      .then(function () { btn.disabled = false; });
  });

  $('clearDone').addEventListener('click', function () {
    var n = actions.filter(function (a) { return a.done; }).length;
    if (!n) return;
    if (confirm('Remove ' + n + ' completed action' + (n === 1 ? '' : 's') + ' for everyone?')) {
      var snapshot = actions.slice();
      actions = actions.filter(function (a) { return !a.done; });
      render();
      rest('/actions?done=eq.true', { method: 'DELETE' })
        .then(okStatus)
        .catch(function (err) { actions = snapshot; render(); fail(err); });
    }
  });

  /* ---------- sign in / out ---------- */
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var user = $('loginUser').value.trim().toLowerCase();
    var pass = $('loginPass').value;
    if (!user || !pass) { setMsg('loginMsg', 'Please enter your username and password.'); return; }
    setMsg('loginMsg', '');
    var btn = $('loginBtn');
    btn.disabled = true;
    signIn(user, pass)
      .then(function () { $('loginPass').value = ''; return start(); })
      .catch(function (err) {
        storeSession(null);
        setMsg('loginMsg', err.status === 400 ? 'Incorrect username or password.' : 'Couldn’t sign in. ' + err.message);
      })
      .then(function () { btn.disabled = false; });
  });

  $('btnSignOut').addEventListener('click', function () {
    var token = session && session.access_token;
    if (token) { authReq('/auth/v1/logout', 'POST', null, token).catch(function () {}); }
    forceSignOut('');
  });

  /* ---------- change password ---------- */
  $('btnPw').addEventListener('click', function () {
    var card = $('pwCard');
    var willShow = card.classList.contains('hidden');
    show('pwCard', willShow);
    setMsg('pwMsg', '');
    if (willShow) $('newPass').focus();
  });
  $('pwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = $('newPass').value;
    if (p.length < 6) { setMsg('pwMsg', 'Password must be at least 6 characters.'); return; }
    validToken()
      .then(function (tok) { return authReq('/auth/v1/user', 'PUT', { password: p }, tok); })
      .then(function () { $('newPass').value = ''; setMsg('pwMsg', 'Password updated.', true); })
      .catch(function (err) { setMsg('pwMsg', err.message || 'Couldn’t update the password.'); });
  });

  /* ---------- team (admin) ---------- */
  function loadTeam() {
    return rest('/profiles?select=username,display_name,role&order=username.asc').then(function (rows) {
      var ul = $('teamList');
      ul.textContent = '';
      rows.forEach(function (r) {
        var li = el('li');
        li.appendChild(el('span', 'u', r.display_name ? r.display_name + ' (' + r.username + ')' : r.username));
        li.appendChild(el('span', 'r', r.role === 'admin' ? 'Admin' : 'Member'));
        ul.appendChild(li);
      });
    });
  }
  $('teamForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('newUser').value.trim().toLowerCase();
    var p = $('newUserPass').value;
    if (!/^[a-z0-9._-]{3,30}$/.test(u)) { setMsg('teamMsg', 'Username must be 3 to 30 characters: letters, numbers, dot, dash or underscore.'); return; }
    if (p.length < 6) { setMsg('teamMsg', 'Password must be at least 6 characters.'); return; }
    setMsg('teamMsg', '');
    var btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    rest('/rpc/create_app_user', { method: 'POST', body: { p_username: u, p_password: p } })
      .then(function () {
        $('newUser').value = ''; $('newUserPass').value = '';
        setMsg('teamMsg', 'Added ' + u + '.', true);
        return loadTeam();
      })
      .catch(function (err) { setMsg('teamMsg', err.message || 'Couldn’t add that user.'); })
      .then(function () { btn.disabled = false; });
  });

  /* ---------- start ---------- */
  function start() {
    return rest('/profiles?id=eq.' + encodeURIComponent(session.user_id) + '&select=username,display_name,role')
      .then(function (rows) {
        profile = rows[0] || { username: 'user', display_name: 'User', role: 'member' };
        $('whoName').textContent = profile.display_name || profile.username;
        show('whoRole', profile.role === 'admin');
        show('teamCard', profile.role === 'admin');
        show('loginView', false); show('appView', true); show('userBar', true);
        show('pwCard', false);
        $('due').value = defaultDue();
        render();
        if (!pollTimer) pollTimer = setInterval(refresh, 30000);
        var jobs = [refresh()];
        if (profile.role === 'admin') jobs.push(loadTeam().catch(function () {}));
        return Promise.all(jobs);
      });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && session) refresh(); });

  if (session) {
    start().catch(function () { forceSignOut('Please sign in again.'); });
  } else {
    show('loginView', true);
  }
})();
</script>
</body>
</html>
